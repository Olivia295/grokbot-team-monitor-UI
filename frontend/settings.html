<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Grok Collab Room</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="settings-page">
  <header class="top">
    <a class="brand" href="/">
      <span class="brand-mascot" id="brand-mascot"></span>
      <div><h1 data-i18n="settings.title"></h1><p data-i18n="settings.tagline"></p></div>
    </a>
    <div class="top-tools">
      <span class="saved" id="saved" role="status" aria-live="polite"></span>
      <a class="primary-btn" href="/" data-i18n="settings.back"></a>
    </div>
  </header>

  <main class="settings-layout">
    <nav class="settings-nav card" data-i18n-aria="settings.title">
      <a href="#general" data-i18n="set.general"></a>
      <a href="#privacy" data-i18n="set.privacy"></a>
      <a href="#data" data-i18n="set.data"></a>
      <a href="#rooms" data-i18n="set.rooms"></a>
      <a href="#bots" data-i18n="set.bots"></a>
      <a href="#about" data-i18n="set.about"></a>
    </nav>

    <div class="settings-body">
      <section class="card set-section" id="general">
        <h2 data-i18n="set.general"></h2>
        <div class="field"><label for="language" data-i18n="set.language"></label>
          <select id="language" data-setting="language"><option value="auto" data-i18n="opt.auto"></option><option value="zh">中文</option><option value="en">English</option></select></div>
        <div class="field"><label for="themeSel" data-i18n="set.theme"></label>
          <select id="themeSel" data-setting="theme"><option value="auto" data-i18n="opt.system"></option><option value="light" data-i18n="opt.light"></option><option value="dark" data-i18n="opt.dark"></option></select></div>
        <div class="field"><label for="hoursSel" data-i18n="set.hours"></label>
          <select id="hoursSel" data-setting="hours" data-number><option value="24" data-i18n="window.24"></option><option value="168" data-i18n="window.168"></option><option value="720" data-i18n="window.720"></option></select></div>
        <div class="field"><label for="refreshSel" data-i18n="set.refresh"></label>
          <select id="refreshSel" data-setting="refreshSeconds" data-number><option value="3">3s</option><option value="5">5s</option><option value="10">10s</option><option value="30">30s</option></select>
          <p class="hint" data-i18n="set.refreshHint"></p></div>
        <div class="field"><label for="motionSel" data-i18n="set.motion"></label>
          <select id="motionSel" data-setting="motion"><option value="full" data-i18n="opt.motionFull"></option><option value="calm" data-i18n="opt.motionCalm"></option><option value="off" data-i18n="opt.motionOff"></option></select></div>
        <div class="field row"><label class="switch"><input type="checkbox" data-setting="ambient"><span></span><b data-i18n="set.ambient"></b></label>
          <p class="hint" data-i18n="set.ambientHint"></p></div>
      </section>

      <section class="card set-section" id="privacy">
        <h2 data-i18n="set.privacy"></h2>
        <div class="field row"><label class="switch"><input type="checkbox" data-setting="privacy"><span></span><b data-i18n="set.privacyMode"></b></label>
          <p class="hint" data-i18n="set.privacyHint"></p></div>
        <p class="hint" data-i18n="set.localOnly"></p>
      </section>

      <section class="card set-section" id="data">
        <h2 data-i18n="set.data"></h2>
        <div class="field"><label for="sourceSel" data-i18n="set.source"></label>
          <select id="sourceSel" data-setting="dataSource"><option value="auto" data-i18n="opt.sourceAuto"></option><option value="grok" data-i18n="opt.sourceGrok"></option><option value="demo" data-i18n="opt.sourceDemo"></option></select></div>
        <div class="field"><label for="supportDir" data-i18n="set.folder"></label>
          <input id="supportDir" data-setting="supportDir" type="text" spellcheck="false" autocomplete="off">
          <p class="hint" data-i18n="set.folderHint"></p></div>
        <p class="status-line" id="source-status"></p>
      </section>

      <section class="card set-section" id="rooms">
        <h2 data-i18n="set.rooms"></h2>
        <p class="hint" data-i18n="set.roomsHint"></p>
        <ol class="room-list" id="room-list"></ol>
      </section>

      <section class="card set-section" id="bots">
        <h2 data-i18n="set.bots"></h2>
        <p class="hint" data-i18n="set.botsHint"></p>
        <div class="bot-picker" id="bot-picker"></div>
        <div class="studio-editor" id="editor" hidden>
          <div class="editor-preview">
            <div class="preview-stage" id="preview"></div>
            <div class="preview-states" role="group" data-i18n-aria="set.previewState">
              <button type="button" data-preview="idle" aria-pressed="true" data-i18n="state.idle"></button>
              <button type="button" data-preview="executing" aria-pressed="false" data-i18n="state.executing"></button>
              <button type="button" data-preview="researching" aria-pressed="false" data-i18n="state.researching"></button>
              <button type="button" data-preview="syncing" aria-pressed="false" data-i18n="state.syncing"></button>
              <button type="button" data-preview="error" aria-pressed="false" data-i18n="state.error"></button>
            </div>
            <div class="field"><label for="alias" data-i18n="set.alias"></label><input id="alias" type="text" maxlength="40" autocomplete="off"></div>
            <div class="field row"><label class="switch"><input type="checkbox" id="botHidden"><span></span><b data-i18n="set.hideBot"></b></label></div>
            <div class="editor-actions">
              <button type="button" id="randomize">🎲 <span data-i18n="set.random"></span></button>
              <button type="button" id="resetLook">↺ <span data-i18n="set.reset"></span></button>
            </div>
          </div>
          <div class="editor-parts">
            <div class="tabs part-tabs" role="tablist" id="part-tabs"></div>
            <div class="part-grid" id="part-grid"></div>
          </div>
        </div>
      </section>

      <section class="card set-section" id="about">
        <h2 data-i18n="set.about"></h2>
        <p data-i18n="about.what"></p>
        <p class="hint" data-i18n="about.data"></p>
        <p class="hint"><span data-i18n="about.file"></span> <code>data/settings.json</code></p>
        <p class="hint" data-i18n="about.license"></p>
      </section>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/avatars.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
