[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-team-monitor-ui"
version = "0.6.0"
description = "Bot Monitoring Room (Bot监控室): watch your Grok Bot team, or any multi-agent system, hand off work in a living office. Local, read-only, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Olivia295" }]
keywords = ["grok", "agents", "multi-agent", "dashboard", "visualization", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Web Environment",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Olivia295/grokbot-team-monitor-UI"
Demo = "https://olivia295.github.io/grokbot-team-monitor-UI/"
Issues = "https://github.com/Olivia295/grokbot-team-monitor-UI/issues"

[project.scripts]
bot-monitor = "grokbot_team_monitor_ui.backend.server:main"
bot-office = "grokbot_team_monitor_ui.backend.server:main"  # the name before 0.6
grokbot-team-monitor-ui = "grokbot_team_monitor_ui.backend.server:main"

# The repository root is the package, so a checkout and an install share one layout:
# grokbot_team_monitor_ui/{backend,frontend,integrations}.
[tool.setuptools]
package-dir = { "grokbot_team_monitor_ui" = "." }
packages = ["grokbot_team_monitor_ui", "grokbot_team_monitor_ui.backend", "grokbot_team_monitor_ui.integrations"]
include-package-data = false

[tool.setuptools.package-data]
grokbot_team_monitor_ui = ["frontend/*.html", "frontend/*.svg", "frontend/css/*.css", "frontend/js/*.js"]
